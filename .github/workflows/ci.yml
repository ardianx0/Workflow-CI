name: Workflow-CI Retraining & Docker Build

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  retrain-and-build:
    runs-on: ubuntu-latest

    steps:
    # 1. Mengambil kode project dari repositori GitHub
    - name: Checkout Code
      uses: actions/checkout@v3

    # 2. Menyiapkan environment Python versi 3.10 di runner cloud
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    # 3. Menginstal semua dependensi Python yang dibutuhkan untuk training
    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow scikit-learn pandas numpy

    # 4. Menjalankan retraining MLProject dengan flag --no-conda agar tidak error virtual env
    - name: Run MLflow Project Retraining
      run: |
        mlflow run MLProject --experiment-name "CI_Automated_Retrain" --no-conda

    # 5. Menyiapkan fitur Docker Buildx di sistem GitHub Actions
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    # 6. Melakukan proses login otomatis ke Docker Hub menggunakan GitHub Secrets
    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    # 7. Mengemas model hasil training menjadi Docker Image dan melakukan push otomatis
    - name: Build and Push Docker Image
      run: |
        echo "Membangun Docker Image untuk serving model..."
        mlflow models build-docker -m "MLProject/model" -n "${{ secrets.DOCKERHUB_USERNAME }}/diabetes-monitoring-app:latest" --enable-mlserver
        
        echo "Mengunggah Image ke Docker Hub..."
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-monitoring-app:latest