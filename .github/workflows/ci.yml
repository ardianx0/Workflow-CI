name: Proyek-SML-Integrated-CI

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  mlflow-ci-build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.10'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install mlflow scikit-learn pandas numpy

    - name: Run MLflow Project Retraining
      run: |
        mlflow run MLProject --experiment-name "CI_Automated_Retrain"

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v2

    - name: Login to Docker Hub
      uses: docker/login-action@v2
      with:
        username: ${{ secrets.DOCKERHUB_USERNAME }}
        password: ${{ secrets.DOCKERHUB_TOKEN }}

    - name: Build and Push Docker Image
      run: |
        # Menggunakan format rahasia dinamis agar otomatis membaca username ardian0x1
        mlflow models build-docker -m "MLProject/model" -n "${{ secrets.DOCKERHUB_USERNAME }}/diabetes-monitoring-app:latest" --enable-mlserver
        docker push ${{ secrets.DOCKERHUB_USERNAME }}/diabetes-monitoring-app:latest